networks:
  project-network:
    name: project-network
    driver: bridge

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackujstat-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    # environment:
    # NODE_ENV: production
    # NEXT_PUBLIC_API_URL: http://localhost:8000/api # Případná vrchní ukázka pro backend
    networks:
      - project-network

  backend:
    image: backend:latest
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: no
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=backend-db
    ports:
      - "8001:8001"
    volumes:
      - ./backend/src/:/app/src/
      - ./backend/main.py:/app/main.py
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/migrations/:/app/migrations/
    networks:
      - project-network
    depends_on:
      backend-db:
        condition: service_healthy

  backend-db:
    image: postgres:16-alpine
    container_name: backend-db
    restart: no
    env_file:
      - ./backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=${POSTGRES_USER:-backend} --dbname=${POSTGRES_DB:-hackujstat}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - project-network

  scheduler:
    image: backend:latest
    container_name: backend-scheduler
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python scheduler.py
    volumes:
      - ./backend/scheduler.py:/app/scheduler.py
      - ./backend/src/:/app/src/
      - ./datasets:/app/datasets
    networks:
      - project-network
